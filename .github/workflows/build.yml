name: Build APK
on:
  workflow_dispatch:
  push:
# Permissão mínima para todos os jobs. Só o job "publicar" (que cria o rascunho da Release) recebe contents: write.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar o projeto
        run: |
          unzip -q "$(ls *.zip | head -1)" -d src
          echo "ANDROID_DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"

      - name: Ativar AndroidX
        run: echo "android.useAndroidX=true" >> "$ANDROID_DIR/gradle.properties"

      - name: Compilar
        run: cd "$ANDROID_DIR" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BetMC-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      # ------------------------------------------------------------------------------------------------
      # V6 · RELEASE ASSINADA (só roda quando se envia uma tag "vX.Y.Z"; os passos acima continuam iguais)
      # Gera o APK assinado com a chave definitiva (GitHub Secrets), calcula o SHA-256, monta o update.json
      # e cria uma Release em RASCUNHO. Quem publica é você, depois de conferir, no botão "Publish release".
      # Nenhuma senha ou chave é impressa: os segredos entram só por variáveis de ambiente (mascaradas pelo GitHub).
      # ------------------------------------------------------------------------------------------------
      - name: "Release · exigir BETMC_CERT_SHA256 (impressão digital do certificado oficial)"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPECTED_CERT: ${{ vars.BETMC_CERT_SHA256 }}
        run: |
          WANT="$(printf '%s' "$EXPECTED_CERT" | tr -d ': \n\r' | tr 'A-F' 'a-f')"
          if ! printf '%s' "$WANT" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::A variável BETMC_CERT_SHA256 é OBRIGATÓRIA para gerar uma Release oficial e deve conter o SHA-256 (64 hexadecimais) do certificado. Crie-a em Settings → Secrets and variables → Actions → Variables com o valor impresso pelo gerar-keystore.yml. Nenhuma Release foi gerada."
            exit 1
          fi
          echo "BETMC_CERT_SHA256 definida (${WANT:0:8}…${WANT: -8})."

      - name: "Release · conferir tag × versão do projeto"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          G="$ANDROID_DIR/app/build.gradle.kts"
          V="$(grep -oP 'val vMajor = \K[0-9]+' "$G").$(grep -oP 'vMinor = \K[0-9]+' "$G").$(grep -oP 'vPatch = \K[0-9]+' "$G")"
          CODE=$(( $(grep -oP 'val vMajor = \K[0-9]+' "$G") * 10000 + $(grep -oP 'vMinor = \K[0-9]+' "$G") * 100 + $(grep -oP 'vPatch = \K[0-9]+' "$G") ))
          echo "Tag: $GITHUB_REF_NAME · versão do projeto: $V (versionCode $CODE)"
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then echo "::error::A tag ($GITHUB_REF_NAME) precisa ser v$V (versão em build.gradle.kts). Corrija a tag ou a versão."; exit 1; fi
          echo "BETMC_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "BETMC_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: "Release · restaurar a chave de assinatura (Secrets)"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KS_B64: ${{ secrets.BETMC_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BETMC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.BETMC_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Faltam Secrets de assinatura (BETMC_KEYSTORE_B64, BETMC_KEYSTORE_PASSWORD, BETMC_KEY_ALIAS). Veja docs/ASSINATURA_E_RELEASES.md. A Release NÃO foi criada."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/betmc-release.p12"
          chmod 600 "$RUNNER_TEMP/betmc-release.p12"
          [ -s "$RUNNER_TEMP/betmc-release.p12" ] || { echo "::error::BETMC_KEYSTORE_B64 não pôde ser decodificado."; exit 1; }
          echo "BETMC_KEYSTORE_PATH=$RUNNER_TEMP/betmc-release.p12" >> "$GITHUB_ENV"

      - name: "Release · compilar APK assinado"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BETMC_KEYSTORE_PASSWORD: ${{ secrets.BETMC_KEYSTORE_PASSWORD }}
          BETMC_KEY_ALIAS: ${{ secrets.BETMC_KEY_ALIAS }}
        run: cd "$ANDROID_DIR" && gradle assembleRelease --no-daemon

      - name: "Release · verificar assinatura e montar update.json"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPECTED_CERT: ${{ vars.BETMC_CERT_SHA256 }}
        run: |
          APK_IN="$ANDROID_DIR/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK_IN" ] || { echo "::error::app-release.apk não foi gerado (o APK sairia sem assinatura)."; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner não encontrado."; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK_IN" > "$RUNNER_TEMP/cert.txt" || { echo "::error::Assinatura do APK inválida."; exit 1; }
          CERT="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/cert.txt" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "Impressão digital (SHA-256) do certificado: $CERT"
          WANT="$(printf '%s' "$EXPECTED_CERT" | tr -d ': \n\r' | tr 'A-F' 'a-f')"
          [ -n "$WANT" ] || { echo "::error::BETMC_CERT_SHA256 ausente: não é permitido gerar Release sem ela."; exit 1; }
          [ "$CERT" = "$WANT" ] || { echo "::error::O certificado deste APK é DIFERENTE do esperado (variável BETMC_CERT_SHA256). Ele não atualizaria as instalações anteriores. Release NÃO criada."; exit 1; }
          echo "Certificado confere com BETMC_CERT_SHA256."
          OUT="$RUNNER_TEMP/release"; mkdir -p "$OUT"
          cp "$APK_IN" "$OUT/BetMC-$BETMC_VERSION_NAME.apk"
          export APK_SHA="$(sha256sum "$OUT/BetMC-$BETMC_VERSION_NAME.apk" | awk '{print $1}')"
          export APK_SIZE="$(stat -c %s "$OUT/BetMC-$BETMC_VERSION_NAME.apk")"
          export OUT_DIR="$OUT" TEMPLATE="$ANDROID_DIR/../update.json" UPDATE_JS="$ANDROID_DIR/../www/update.js"
          [ -f "$TEMPLATE" ] || { echo "::error::update.json (modelo) não encontrado na raiz do projeto."; exit 1; }
          [ -f "$UPDATE_JS" ] || { echo "::error::www/update.js não encontrado no ZIP extraído ($UPDATE_JS)."; exit 1; }
          python3 - <<'PY'
          import json, os, datetime
          t = json.load(open(os.environ['TEMPLATE'], encoding='utf-8'))
          v = os.environ['BETMC_VERSION_NAME']
          t['latestVersionCode'] = int(os.environ['BETMC_VERSION_CODE']); t['latestVersionName'] = v
          t['apkUrl'] = 'https://github.com/%s/releases/download/v%s/BetMC-%s.apk' % (os.environ['GITHUB_REPOSITORY'], v, v)
          t['apkSize'] = int(os.environ['APK_SIZE']); t['sha256'] = os.environ['APK_SHA']
          t['publishedAt'] = datetime.date.today().isoformat()
          json.dump(t, open(os.path.join(os.environ['OUT_DIR'], 'update.json'), 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          node -e "const path=require('path'),fs=require('fs');const U=require(path.resolve(process.env.UPDATE_JS));const r=U.parse(fs.readFileSync(path.resolve(process.env.OUT_DIR,'update.json'),'utf8'));if(!r.ok){console.error('update.json gerado é inválido: '+r.err);process.exit(1)};console.log('update.json válido:',r.info.latestVersionName,r.info.sha256)"
          cat "$OUT/update.json"

      - name: "Release · guardar APK e update.json como artefato"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: BetMC-release
          path: ${{ runner.temp }}/release/*

  # ------------------------------------------------------------------------------------------------
  # Job separado e mínimo: é o ÚNICO com contents: write. Não faz checkout, não usa Secrets de assinatura e
  # não executa código do repositório: só baixa o artefato do job "build", reconfere e cria o RASCUNHO da Release.
  # ------------------------------------------------------------------------------------------------
  publicar:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BetMC-release
          path: release

      - name: "Criar RASCUNHO da Release (não publica)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag fora do padrão vX.Y.Z."; exit 1; }
          VER="$(python3 -c "import json; print(json.load(open('release/update.json', encoding='utf-8'))['latestVersionName'])")"
          [ "$GITHUB_REF_NAME" = "v$VER" ] || { echo "::error::A tag ($GITHUB_REF_NAME) não corresponde à versão do update.json (v$VER)."; exit 1; }
          APK="release/BetMC-$VER.apk"
          [ -f "$APK" ] || { echo "::error::$APK não encontrado no artefato."; exit 1; }
          [ "$(sha256sum "$APK" | awk '{print $1}')" = "$(python3 -c "import json; print(json.load(open('release/update.json', encoding='utf-8'))['sha256'])")" ] || { echo "::error::O SHA-256 do APK não confere com o update.json. Release NÃO criada."; exit 1; }
          FILES=("$APK" "release/update.json")
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "A Release $GITHUB_REF_NAME já existe (criada por você): só anexando o APK e o update.json."
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --verify-tag --draft --title "BETMC $VER" \
              --notes "Rascunho gerado pelo GitHub Actions. Confira, publique a Release e só depois copie o update.json (anexo) para a raiz da branch main."
          fi
