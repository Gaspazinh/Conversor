name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Descompactar o projeto
        run: |
          unzip -q "$(ls *.zip | head -1)" -d src
          echo "ANDROID_DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"
      - name: Compilar
        run: cd "$ANDROID_DIR" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BetMC-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
