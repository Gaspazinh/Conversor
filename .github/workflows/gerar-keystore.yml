name: Gerar keystore (USO ÚNICO - leia docs/ASSINATURA_E_RELEASES.md)
# Cria UMA chave de assinatura definitiva para a BETMC e a guarda no Secret BETMC_KEYSTORE_B64.
# Só roda manualmente. Recusa-se a rodar se a chave já existir (assim ela nunca é substituída por engano).
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite GERAR (em maiúsculas) para confirmar'
        required: true
        type: string
permissions:
  contents: read
# Nunca duas execuções ao mesmo tempo (evita que as duas passem na checagem e uma sobrescreva a outra).
concurrency:
  group: gerar-keystore
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Conferir pré-requisitos (nada secreto é impresso)
        env:
          CONF: ${{ inputs.confirmar }}
          KS_PASS: ${{ secrets.BETMC_KEYSTORE_PASSWORD }}
          BK_PASS: ${{ secrets.BETMC_BACKUP_PASSPHRASE }}
          KS_ALIAS: ${{ secrets.BETMC_KEY_ALIAS }}
          GH_TOKEN: ${{ secrets.BETMC_ADMIN_TOKEN }}
        run: |
          [ "$CONF" = "GERAR" ] || { echo "::error::Confirmação incorreta. Digite GERAR."; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Execute este workflow na branch main."; exit 1; }
          [ -n "$KS_PASS" ] && [ ${#KS_PASS} -ge 24 ] || { echo "::error::Secret BETMC_KEYSTORE_PASSWORD ausente ou com menos de 24 caracteres."; exit 1; }
          [ -n "$BK_PASS" ] && [ ${#BK_PASS} -ge 24 ] || { echo "::error::Secret BETMC_BACKUP_PASSPHRASE ausente ou com menos de 24 caracteres."; exit 1; }
          [ "$KS_PASS" != "$BK_PASS" ] || { echo "::error::BETMC_BACKUP_PASSPHRASE deve ser DIFERENTE de BETMC_KEYSTORE_PASSWORD."; exit 1; }
          printf '%s' "$KS_ALIAS" | grep -Eq '^[a-z0-9_-]{1,32}$' || { echo "::error::Secret BETMC_KEY_ALIAS ausente ou inválido (use só letras minúsculas, números, _ ou -)."; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "::error::Secret BETMC_ADMIN_TOKEN (token temporário com permissão de Secrets) ausente."; exit 1; }
          if ! LIST="$(gh secret list --repo "$GITHUB_REPOSITORY" 2>/dev/null)"; then
            echo "::error::O token BETMC_ADMIN_TOKEN não consegue listar/gravar Secrets neste repositório (permissão Secrets: leitura e escrita)."; exit 1
          fi
          if printf '%s\n' "$LIST" | grep -Eq '^BETMC_KEYSTORE_B64([[:space:]]|$)'; then
            echo "::error::O Secret BETMC_KEYSTORE_B64 JÁ EXISTE. Nada foi alterado. Se ele sumiu, RESTAURE do backup (docs/ASSINATURA_E_RELEASES.md): gerar outra chave impediria atualizar as instalações existentes."; exit 1
          fi
          echo "Pré-requisitos ok. Nenhuma chave existente será sobrescrita."

      - name: Criar a keystore (RSA 4096, PKCS12, ~30 anos)
        env:
          KS_PASS: ${{ secrets.BETMC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.BETMC_KEY_ALIAS }}
        run: |
          umask 077
          D="$RUNNER_TEMP/ks"; mkdir -p "$D"
          if ! keytool -genkeypair -alias "$KS_ALIAS" -keyalg RSA -keysize 4096 -validity 10950 -storetype PKCS12 \
               -keystore "$D/betmc-release.p12" -storepass:env KS_PASS -dname "CN=BetMC, O=BetMC, C=BR" > "$D/keytool.log" 2>&1; then
            echo "::error::keytool falhou:"; cat "$D/keytool.log"; exit 1
          fi
          FP="$(keytool -list -v -keystore "$D/betmc-release.p12" -storepass:env KS_PASS 2>/dev/null | grep -m1 'SHA256:' || true)"
          [ -n "$FP" ] || { echo "::error::Não foi possível ler a impressão digital: a keystore não é utilizável."; exit 1; }
          echo "Impressão digital do certificado (pública). Guarde na variável BETMC_CERT_SHA256:"; echo "$FP"
          base64 -w0 "$D/betmc-release.p12" > "$D/b64.txt"
          [ "$(wc -c < "$D/b64.txt")" -lt 40000 ] || { echo "::error::Chave grande demais para um Secret (limite 48 KB)."; exit 1; }
          base64 -d "$D/b64.txt" | cmp - "$D/betmc-release.p12" || { echo "::error::Conferência base64 falhou."; exit 1; }
          echo "Conferência base64 ↔ keystore: ok."

      - name: Cifrar o backup (o artefato de repositório público é baixável por qualquer conta logada)
        env:
          BK_PASS: ${{ secrets.BETMC_BACKUP_PASSPHRASE }}
        run: |
          umask 077
          D="$RUNNER_TEMP/ks"; mkdir -p "$D/backup"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BK_PASS -in "$D/betmc-release.p12" -out "$D/backup/betmc-release.p12.enc"
          [ -s "$D/backup/betmc-release.p12.enc" ] || { echo "::error::Backup cifrado não foi criado."; exit 1; }
          echo "Backup cifrado criado."

      # O backup sobe ANTES de gravar o Secret: se o upload falhar, nada foi gravado e a chave não fica só dentro de um Secret (que não se pode ler de volta).
      - name: Backup cifrado (artefato de 1 dia)
        uses: actions/upload-artifact@v4
        with:
          name: BETMC-KEYSTORE-BACKUP-CIFRADO-BAIXE-E-APAGUE
          path: ${{ runner.temp }}/ks/backup/betmc-release.p12.enc
          retention-days: 1
          if-no-files-found: error

      - name: Gravar a chave no Secret BETMC_KEYSTORE_B64
        env:
          GH_TOKEN: ${{ secrets.BETMC_ADMIN_TOKEN }}
        run: |
          # nova checagem imediatamente antes de gravar (a primeira foi minutos atrás)
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -Eq '^BETMC_KEYSTORE_B64([[:space:]]|$)'; then
            echo "::error::O Secret BETMC_KEYSTORE_B64 apareceu durante a execução. Nada foi sobrescrito."; exit 1
          fi
          gh secret set BETMC_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ks/b64.txt"
          gh secret list --repo "$GITHUB_REPOSITORY" | grep -Eq '^BETMC_KEYSTORE_B64([[:space:]]|$)' || { echo "::error::O Secret não aparece na lista após gravar."; exit 1; }
          echo "Secret BETMC_KEYSTORE_B64 gravado. O backup desta execução é o válido."

      - name: Próximos passos
        run: |
          echo "1) Baixe AGORA o artefato BETMC-KEYSTORE-BACKUP-CIFRADO-BAIXE-E-APAGUE e guarde em 2 lugares."
          echo "2) Apague o artefato logo depois de baixar."
          echo "3) Crie a variável BETMC_CERT_SHA256 com a impressão digital acima."
          echo "4) Apague os Secrets/token BETMC_ADMIN_TOKEN e BETMC_BACKUP_PASSPHRASE (guarde a frase no gerenciador de senhas) e desative/apague este workflow."
          echo "Para abrir o backup depois: openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in betmc-release.p12.enc -out betmc-release.p12   (pede a frase)"
