
name: Atualizar tag Git

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar tag v6.0.0
        run: |
          git tag -f v6.0.0
          git push --force origin v6.0.0
