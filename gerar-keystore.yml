name: Gerar keystore (USO ÚNICO - leia docs/ASSINATURA_E_RELEASES.md)
# Cria UMA chave de assinatura definitiva para a BETMC e a guarda no Secret BETMC_KEYSTORE_B64.
# Só roda manualmente. Recusa-se a rodar se a chave já existir (assim ela nunca é substituída por engano).
# Depois de usar: baixe o backup, apague o artefato, apague o token temporário e DESATIVE/APAGUE este workflow.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite GERAR (em maiúsculas) para confirmar'
        required: true
        type: string
permissions:
  contents: read
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Conferir pré-requisitos (nada secreto é impresso)
        env:
          CONF: ${{ inputs.confirmar }}
          KS_PASS: ${{ secrets.BETMC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.BETMC_KEY_ALIAS }}
          GH_TOKEN: ${{ secrets.BETMC_ADMIN_TOKEN }}
        run: |
          [ "$CONF" = "GERAR" ] || { echo "::error::Confirmação incorreta. Digite GERAR."; exit 1; }
          [ "${{ github.ref }}" = "refs/heads/main" ] || { echo "::error::Execute este workflow na branch main."; exit 1; }
          [ -n "$KS_PASS" ] && [ ${#KS_PASS} -ge 24 ] || { echo "::error::Secret BETMC_KEYSTORE_PASSWORD ausente ou com menos de 24 caracteres."; exit 1; }
          printf '%s' "$KS_ALIAS" | grep -Eq '^[A-Za-z0-9_-]{1,32}$' || { echo "::error::Secret BETMC_KEY_ALIAS ausente ou inválido (use letras, números, _ ou -)."; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "::error::Secret BETMC_ADMIN_TOKEN (token temporário com permissão de Secrets) ausente."; exit 1; }
          if ! LIST="$(gh secret list --repo "$GITHUB_REPOSITORY" 2>/dev/null)"; then
            echo "::error::O token BETMC_ADMIN_TOKEN não consegue listar/gravar Secrets neste repositório (permissão Secrets: leitura e escrita)."; exit 1
          fi
          if printf '%s\n' "$LIST" | grep -q '^BETMC_KEYSTORE_B64'; then
            echo "::error::O Secret BETMC_KEYSTORE_B64 JÁ EXISTE. Esta chave não será substituída (trocar a chave impede atualizar as instalações existentes)."; exit 1
          fi
          echo "Pré-requisitos ok. Nenhuma chave existente será sobrescrita."

      - name: Criar a keystore (RSA 4096, PKCS12, ~30 anos)
        env:
          KS_PASS: ${{ secrets.BETMC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.BETMC_KEY_ALIAS }}
        run: |
          umask 077
          D="$RUNNER_TEMP/ks"; mkdir -p "$D"
          keytool -genkeypair -alias "$KS_ALIAS" -keyalg RSA -keysize 4096 -validity 10950 -storetype PKCS12 \
            -keystore "$D/betmc-release.p12" -storepass:env KS_PASS -dname "CN=BetMC, O=BetMC, C=BR" 2>&1 | grep -v -i 'password' || true
          [ -s "$D/betmc-release.p12" ] || { echo "::error::A keystore não foi criada."; exit 1; }
          echo "Impressão digital (SHA-256) do certificado, que é pública. Guarde-a na variável BETMC_CERT_SHA256:"
          keytool -list -v -keystore "$D/betmc-release.p12" -storepass:env KS_PASS 2>/dev/null | grep -E 'SHA256:' | head -1
          base64 -w0 "$D/betmc-release.p12" > "$D/betmc-release.p12.base64.txt"

      - name: Gravar a chave no Secret BETMC_KEYSTORE_B64
        env:
          GH_TOKEN: ${{ secrets.BETMC_ADMIN_TOKEN }}
        run: |
          gh secret set BETMC_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ks/betmc-release.p12.base64.txt"
          echo "Secret BETMC_KEYSTORE_B64 gravado."

      - name: Backup (artefato de 1 dia)
        uses: actions/upload-artifact@v4
        with:
          name: BETMC-KEYSTORE-BACKUP-BAIXE-E-APAGUE
          path: |
            ${{ runner.temp }}/ks/betmc-release.p12
            ${{ runner.temp }}/ks/betmc-release.p12.base64.txt
          retention-days: 1
          if-no-files-found: error

      - name: Próximos passos
        run: |
          echo "1) Baixe AGORA o artefato BETMC-KEYSTORE-BACKUP-BAIXE-E-APAGUE (aba Summary desta execução) e guarde em 2 lugares."
          echo "2) Apague o artefato logo depois de baixar (em repositório público, qualquer conta logada poderia baixá-lo)."
          echo "3) Crie a variável BETMC_CERT_SHA256 com a impressão digital acima."
          echo "4) Apague o token BETMC_ADMIN_TOKEN (Secret e token no GitHub) e desative/apague este workflow."
